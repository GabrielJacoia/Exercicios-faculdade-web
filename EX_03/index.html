<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista e tabela</title>
</head>
<body>
    <h1>Exercicio 03 - Lista e Tabela</h1>

    <h2>Lista Ordenada</h2>
    <ol>
        <li>Primeiro item da lista</li>
        <li>Segundo item da lista</li>
    </ol>

    <h2>Lista não ordenada</h2>
    <ul>
        <li>Vermelho</li>
        <li>Azul</li>
    </ul>

    <h2>Tabela</h2>
    <table>
       <tr>
        <th>Itens</th>
        <th>Quantidade</th>
        <th>Total</th>
       </tr>

       <tr>
        <td>Registro 01</td>
        <td>3</td>
        <td>R$30</td>
       </tr>

       <tr>
        <td>Registro 02</td>
        <td>2</td>
        <td>R$75</td>
       </tr>
    </table>
</body>
</html>
